[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supermarket-comparison"
version = "0.1.0"
description = "DACH supermarket price comparison API (Lidl, Edeka, Rewe, Marktguru, Open Food Facts)"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic>=2.0",
    "pypdf>=6.21.4",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["supermarket_comparison", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "B008",  # FastAPI uses function calls (Depends/Query) in defaults
    "RUF001", # German strings intentionally contain non-ASCII characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["supermarket_comparison"]
combine-as-imports = true

[tool.hatch.build.targets.wheel]
packages = ["supermarket_comparison"]
